faq:
- q: Who are the doctors?
  a: Dr. Priya Raghavan (BDS, MDS - Root canal specialist) and Dr. Arun Kumar (BDS
    - General dentistry). Dr. Priya is available in the evenings, Dr. Arun in the
    mornings.
- q: Do you accept insurance?
  a: We do not have cashless insurance tie-ups. We provide a detailed bill and treatment
    summary that you can submit to your insurer for reimbursement.
- q: Is there parking?
  a: Two-wheeler parking is available in front of the building. For cars, paid parking
    is available at Kikani School grounds, a 2-minute walk away.
- q: Do you have EMI options?
  a: Yes, for treatments above ₹20,000 (braces, implants) we offer no-cost EMI through
    Bajaj Finserv. Carry your Aadhaar and PAN card.
- q: Is root canal painful?
  a: The procedure is done under local anesthesia, so you will feel almost nothing
    during it. Mild soreness for a day or two afterwards is normal.
- q: How long does teeth cleaning take?
  a: A scaling and polishing session takes about 30 to 40 minutes.
- q: Are walk-ins allowed?
  a: Walk-ins are accepted, but appointment patients are seen first, so walk-ins may
    wait 45 minutes or more. Booking a slot is strongly recommended.
- q: Do you treat children?
  a: Yes, we see children of all ages. Kids' check-ups are ₹250, and Dr. Arun is very
    good with young children.
- q: Which languages do the staff speak?
  a: Tamil, English and Hindi.
- q: Do you do X-rays at the clinic?
  a: Yes, we have digital X-ray in-house (₹250 per tooth). For full-mouth OPG X-rays
    we refer you to a scan centre next door.
policies:
- A booking fee of ₹100 is collected to confirm an appointment. It is adjusted against
  the final bill. The booking fee is NON-REFUNDABLE if you cancel.
- Rescheduling is free if done at least 4 hours before the appointment time.
- If you arrive more than 15 minutes late, your slot may be given away and you will
  be treated as a walk-in.
- All prices are indicative. The exact treatment cost is confirmed by the doctor after
  examination.
fallback: If you are unsure about anything, or the customer asks something not covered
  in the business information, say that the front desk will call them back with the
  exact details. NEVER guess or invent prices, offers, or medical advice.
