# Demo client config — a fictional dental clinic in Coimbatore.
# WHY YAML: business knowledge lives here, never in Python code. To onboard a new
# client, copy this file, edit the values, done. (Architecture principle 1.)
#
# NOTE: dates and times are quoted on purpose. Unquoted, YAML parses 2026-07-06
# as a date object and 10:00 as the number 600 (base-60!). Quoting keeps them strings.

client_id: demo_clinic
access_key: VX-84KQ2N   # the owner's login code for the portal
twilio_number: "+16592517349"   # calls to this number reach this business
business_name: Sri Balaji Dental Care
address: "2nd Floor, 45 D.B. Road, R.S. Puram, Coimbatore - 641002 (above Aravind Pharmacy, opposite Kikani School)"
phone: "+91 98430 12345"
timings: "Monday to Saturday: 9:30 AM - 1:00 PM and 4:00 PM - 8:30 PM. Sunday closed."

services:
  - name: Dental consultation
    price: "₹300"
  - name: Kids dental check-up (under 12)
    price: "₹250"
  - name: Scaling & polishing (teeth cleaning)
    price: "₹1,200"
  - name: Digital X-ray (per tooth)
    price: "₹250"
  - name: Tooth extraction (simple)
    price: "₹800 per tooth"
  - name: Wisdom tooth removal (surgical)
    price: "₹3,500 per tooth"
  - name: Root canal treatment
    price: "₹4,500 per tooth (including temporary filling)"
  - name: Dental crown (ceramic)
