<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#F5F3EA"},
    {"id":"color-ink","type":"color","label":"Text","default":"#182A25"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#176F63"},
    {"id":"font-display","type":"string","label":"Display font","default":"Instrument Serif"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP vendored locally (3.14.2) so renders never depend on the network. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #f5f3ea;
        --color-ink: #182a25;
        --color-accent: #176f63;
        --font-display: "Instrument Serif";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f5f3ea; }
      #root { width: 100%; height: 100%; position: relative; }
      /* Full-bleed paper under every scene (scenes are transparent where empty). */
      #paper { position: absolute; inset: 0; background: #f5f3ea; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1920" data-height="1080">
      <div id="paper" class="clip" data-start="0" data-duration="25" data-track-index="0"></div>

      <!-- Six scenes, one per beat of the owner's storyboard (brag-plan.md). -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
           data-start="0" data-duration="3.2" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
           data-start="3.2" data-duration="2.6" data-track-index="2" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="listen" data-composition-id="listen" data-composition-src="compositions/listen.html"
           data-start="5.8" data-duration="6" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="book" data-composition-id="book" data-composition-src="compositions/book.html"
           data-start="11.8" data-duration="7" data-track-index="2" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="owner" data-composition-id="owner" data-composition-src="compositions/owner.html"
           data-start="18.8" data-duration="3" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
           data-start="21.8" data-duration="3.2" data-track-index="2" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>

      <!-- Music: Sascha Ende, ende.app (CC BY 4.0). Low bed, its own lift at ~17 s carries the payoff. -->
      <audio id="music" class="clip" data-start="0" data-duration="25" data-track-index="5"
             data-volume="0.35" data-fade-in="1" data-fade-out="1.5"
             src="assets/music/happy-beats-business-moves-vol-1-by-ende-dot-app.mp3"></audio>
      <!-- SFX: one per real action on screen; the bell only on the saved booking. -->
      <audio id="sfx-chip-1" class="clip" data-start="8.05" data-duration="0.14" data-track-index="6"
             data-volume="0.55" src="assets/sfx/impact/impactSoft_medium_002.ogg"></audio>
      <audio id="sfx-chip-2" class="clip" data-start="14.05" data-duration="0.15" data-track-index="6"
             data-volume="0.55" src="assets/sfx/impact/impactSoft_medium_004.ogg"></audio>
      <audio id="sfx-bell" class="clip" data-start="18.05" data-duration="1.48" data-track-index="7"
             data-volume="0.45" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
