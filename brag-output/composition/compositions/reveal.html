        <div id="rv-name">Atithi</div>

  <script>
    const tl = gsap.timeline({ paused: true });
    // The mark settles in (slightly large, then settles), the name follows it.
    tl.fromTo("#rv-mark", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0.05);

    // Hold still, then a soft crossfade exit (polished: 0.6 s).
    tl.to("#rv-lockup", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 2.25);
