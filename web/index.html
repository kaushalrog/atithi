<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxAgent — AI Receptionist</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --ink: #1c2733;
    --muted: #6b7a89;
    --accent: #0e7c7b;
    --accent-dark: #0a5c5b;
    --accent-soft: #e3f2f1;
    --user-bubble: #0e7c7b;
    --agent-bubble: #ffffff;
    --border: #e2e8ee;
    --danger: #d94f4f;
    --radius: 14px;
    font-size: 15px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }

  header {
    background: linear-gradient(90deg, #0a5c5b, #0e7c7b 55%, #17998f);
    color: #fff; padding: 12px 22px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: .3px; }
  header .logo span { opacity: .75; font-weight: 400; }
  header .spacer { flex: 1; }
  header select {
    background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.35);
    border-radius: 8px; padding: 6px 10px; font-size: .92rem;
  }
  header select option { color: var(--ink); }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #7ef0b2; display: inline-block; margin-right: 6px; }

  main {
    flex: 1; display: grid; grid-template-columns: 1fr 330px;
    gap: 16px; padding: 16px 22px; min-height: 0; max-width: 1250px; width: 100%; margin: 0 auto;
  }

  /* ---- chat column ---- */
  .chat-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    box-shadow: 0 2px 10px rgba(20,40,60,.05);
  }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .bubble {
    max-width: 76%; padding: 10px 14px; border-radius: 16px; line-height: 1.45;
    white-space: pre-wrap; word-wrap: break-word; animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(5px); } }
  .bubble.user { align-self: flex-end; background: var(--user-bubble); color: #fff; border-bottom-right-radius: 5px; }
  .bubble.agent { align-self: flex-start; background: var(--agent-bubble); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
  .bubble.note { align-self: center; background: var(--accent-soft); color: var(--accent-dark); font-size: .85rem; border-radius: 10px; }
  .tool-chip {
    align-self: flex-start; font-size: .78rem; color: var(--muted);
    background: #f0f3f6; border: 1px dashed #cfd9e2; border-radius: 8px; padding: 4px 10px;
    font-family: Consolas, monospace;
  }
  .typing { align-self: flex-start; padding: 12px 16px; }
  .typing i { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: #b8c4cf; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }

  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: #fbfcfd; }
  .composer input[type=text] {
    flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; font-size: 1rem; outline: none;
  }
  .composer input[type=text]:focus { border-color: var(--accent); }
  .btn {
    border: none; border-radius: 10px; padding: 0 16px; font-size: 1rem; cursor: pointer;
    background: var(--accent); color: #fff; transition: background .15s;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.mic { background: #eef2f5; color: var(--ink); font-size: 1.15rem; width: 48px; }
  .btn.mic:hover { background: #e2e9ee; }
  .btn.mic.recording { background: var(--danger); color: #fff; animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(217,79,79,.25); } }

  /* ---- sidebar ---- */
  aside { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 15px 17px; box-shadow: 0 2px 10px rgba(20,40,60,.05);
  }
  .card h3 { margin: 0 0 9px; font-size: .8rem; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .card .biz-name { font-size: 1.06rem; font-weight: 650; margin-bottom: 5px; }
  .card .meta { font-size: .86rem; color: var(--muted); line-height: 1.5; }
  .services { max-height: 170px; overflow-y: auto; font-size: .86rem; }
  .services div { display: flex; justify-content: space-between; gap: 8px; padding: 3.5px 0; border-bottom: 1px dotted #edf1f4; }
  .services div span:last-child { color: var(--accent-dark); font-weight: 600; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 3px 6px 6px 0; }
  td { padding: 4px 6px 4px 0; border-top: 1px solid #f0f3f6; }
  .pill { background: var(--accent-soft); color: var(--accent-dark); border-radius: 20px; padding: 1px 9px; font-size: .75rem; }
  .empty { color: var(--muted); font-size: .86rem; }
  .row-btns { display: flex; gap: 8px; }
  .btn.ghost { background: #eef2f5; color: var(--ink); font-size: .87rem; padding: 9px 12px; flex: 1; }
  .btn.ghost:hover { background: #e2e9ee; }
  label.toggle { display: flex; align-items: center; gap: 8px; font-size: .9rem; cursor: pointer; user-select: none; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; overflow-y: auto; }
    .chat-panel { min-height: 65vh; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🎙️ VoxAgent <span>— AI Receptionist</span></div>
  <div class="spacer"></div>
  <label class="toggle" style="color:#fff">
    <input type="checkbox" id="voiceToggle" checked> 🔊 Voice replies
  </label>
  <select id="clientSelect" title="Business"></select>
  <div><span class="status-dot"></span><span id="statusText" style="font-size:.88rem">connecting…</span></div>
</header>

<main>
  <section class="chat-panel">
    <div id="chat"></div>
    <div class="composer">
      <button class="btn mic" id="micBtn" title="Hold a conversation by voice">🎙️</button>
      <input type="text" id="msgInput" placeholder="Type a message… (or use the mic)" autocomplete="off">
      <button class="btn" id="sendBtn">Send</button>
    </div>
  </section>

  <aside>
    <div class="card" id="bizCard">
      <h3>Business</h3>
      <div class="biz-name" id="bizName">—</div>
      <div class="meta" id="bizMeta"></div>
    </div>
    <div class="card">
      <h3>Services &amp; prices</h3>
      <div class="services" id="servicesList"></div>
    </div>
    <div class="card">
      <h3>Bookings <span class="pill" id="bookingCount">0</span></h3>
      <div id="bookingsBox"><div class="empty">No bookings yet.</div></div>
    </div>
    <div class="row-btns">
      <button class="btn ghost" id="resetBtn">↺ New conversation</button>
      <button class="btn ghost" id="transcriptBtn">⤓ Transcript</button>
    </div>
  </aside>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
let SID = null;
let busy = false;

/* ---------- tiny API helper ---------- */
async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  };
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

/* ---------- chat rendering ---------- */
function addBubble(kind, text) {
  const div = document.createElement("div");
  div.className = "bubble " + kind;
  div.textContent = text;
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
  return div;
}
function addToolChip(tool) {
  const div = document.createElement("div");
  div.className = "tool-chip";
  div.textContent = "🔧 " + tool.name + "(" + JSON.stringify(tool.args) + ")";
  $("chat").appendChild(div);
}
function showTyping() {
  const div = document.createElement("div");
  div.className = "typing bubble agent"; div.id = "typing";
  div.innerHTML = "<i></i><i></i><i></i>";
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
}
function hideTyping() { const t = $("typing"); if (t) t.remove(); }

/* ---------- session / business info ---------- */
async function newSession(clientId) {
  const s = await api("/api/session", { client_id: clientId });
  SID = s.session_id;
  $("bizName").textContent = s.business_name;
  $("bizMeta").innerHTML = "";
  const meta = document.createElement("div");
  meta.textContent = s.timings + "\n" + s.address + (s.phone ? "\n☎ " + s.phone : "");
  meta.style.whiteSpace = "pre-wrap";
  $("bizMeta").appendChild(meta);
  const list = $("servicesList"); list.innerHTML = "";
  for (const svc of s.services) {
    const row = document.createElement("div");
    const n = document.createElement("span"); n.textContent = svc.name;
    const p = document.createElement("span"); p.textContent = svc.price;
    row.append(n, p); list.appendChild(row);
  }
  $("chat").innerHTML = "";
  addBubble("note", "You're connected to " + s.business_name + ". Ask about services or prices, or book an appointment — by text or voice.");
  $("statusText").textContent = "online";
}

/* ---------- sending a turn ---------- */
async function handleResponse(r) {
  hideTyping();
  (r.tools || []).forEach(addToolChip);
  if (r.reply) {
    addBubble("agent", r.reply);
    if ($("voiceToggle").checked) speak(r.reply);
  }
  loadBookings();
}
async function sendText() {
  const text = $("msgInput").value.trim();
  if (!text || busy) return;
  $("msgInput").value = "";
  addBubble("user", text);
  await runTurn(() => api("/api/chat", { session_id: SID, message: text }));
}
async function runTurn(call) {
  busy = true; $("sendBtn").disabled = true; showTyping();
  try {
    await handleResponse(await call());
  } catch (err) {
    hideTyping();
    addBubble("note", "⚠ " + err.message + " — starting a fresh session.");
    await newSession($("clientSelect").value).catch(() => {});
  } finally {
    busy = false; $("sendBtn").disabled = false; $("msgInput").focus();
  }
}

/* ---------- spoken replies ---------- */
async function speak(text) {
  try {
    const res = await fetch("/api/tts", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
    });
    if (!res.ok) return;
    new Audio(URL.createObjectURL(await res.blob())).play();
  } catch (e) { /* voice output must never break the chat */ }
}

/* ---------- microphone (records plain WAV — every browser, no codecs) ---------- */
class WavRecorder {
  async start() {
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    this.ctx = new AudioContext();
    this.rate = this.ctx.sampleRate;
    this.chunks = [];
    const src = this.ctx.createMediaStreamSource(this.stream);
    this.proc = this.ctx.createScriptProcessor(4096, 1, 1);
    this.proc.onaudioprocess = e => this.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    src.connect(this.proc); this.proc.connect(this.ctx.destination);
  }
  async stop() {
    this.proc.disconnect();
    this.stream.getTracks().forEach(t => t.stop());
    await this.ctx.close();
    return encodeWav(this.chunks, this.rate);
  }
}
function encodeWav(chunks, sampleRate) {
  const total = chunks.reduce((n, c) => n + c.length, 0);
  const buf = new ArrayBuffer(44 + total * 2);
  const v = new DataView(buf);
  const str = (off, s) => { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + total * 2, true); str(8, "WAVE");
  str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, total * 2, true);
  let off = 44;
  for (const c of chunks) for (let i = 0; i < c.length; i++, off += 2) {
    const s = Math.max(-1, Math.min(1, c[i]));
    v.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buf], { type: "audio/wav" });
}

let recorder = null;
async function toggleMic() {
  if (busy && !recorder) return;
  if (!recorder) {
    try {
      recorder = new WavRecorder();
      await recorder.start();
      $("micBtn").classList.add("recording");
      $("micBtn").textContent = "⏹";
    } catch (e) {
      recorder = null;
      addBubble("note", "⚠ Microphone unavailable: " + e.message);
    }
    return;
  }
  const wav = await recorder.stop();
  recorder = null;
  $("micBtn").classList.remove("recording");
  $("micBtn").textContent = "🎙️";
  const heardBubble = addBubble("user", "🎙 …");
  await runTurn(async () => {
    const form = new FormData();
    form.append("session_id", SID);
    form.append("audio", wav, "speech.wav");
    const res = await fetch("/api/voice", { method: "POST", body: form });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    const r = await res.json();
    if (!r.heard) { heardBubble.remove(); return { reply: "", tools: [] }; }
    heardBubble.textContent = r.heard;
    return r;
  });
}

/* ---------- bookings panel ---------- */
async function loadBookings() {
  try {
    const rows = await api("/api/bookings");
    $("bookingCount").textContent = rows.length;
    const box = $("bookingsBox");
    if (!rows.length) { box.innerHTML = '<div class="empty">No bookings yet.</div>'; return; }
    const table = document.createElement("table");
    table.innerHTML = "<tr><th>Name</th><th>Service</th><th>When</th></tr>";
    for (const r of rows.slice(0, 8)) {
      const tr = document.createElement("tr");
      for (const val of [r.name, r.service, r.date + " " + r.time]) {
        const td = document.createElement("td"); td.textContent = val; tr.appendChild(td);
      }
      table.appendChild(tr);
    }
    box.innerHTML = ""; box.appendChild(table);
  } catch (e) { /* panel is decorative — never break the chat over it */ }
}

/* ---------- wiring ---------- */
$("sendBtn").onclick = sendText;
$("msgInput").addEventListener("keydown", e => { if (e.key === "Enter") sendText(); });
$("micBtn").onclick = toggleMic;
$("resetBtn").onclick = async () => {
  if (SID) await api("/api/reset", { session_id: SID }).catch(() => {});
  await newSession($("clientSelect").value);
};
$("transcriptBtn").onclick = () => { if (SID) window.open("/api/transcript/" + SID); };
$("clientSelect").onchange = () => newSession($("clientSelect").value);

(async function init() {
  try {
    const clients = await api("/api/clients");
    const sel = $("clientSelect");
    for (const c of clients) {
      const opt = document.createElement("option");
      opt.value = c.client_id; opt.textContent = c.business_name;
      sel.appendChild(opt);
    }
    await newSession(sel.value);
    loadBookings();
    setInterval(loadBookings, 15000);
    $("msgInput").focus();
  } catch (e) {
    $("statusText").textContent = "error";
    addBubble("note", "⚠ Could not reach the server: " + e.message);
  }
})();
</script>
</body>
</html>
