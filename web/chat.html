<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #fafaf9; --surface: #ffffff; --border: #e7e5e4; --border-strong: #d6d3d1;
    --ink: #1c1917; --muted: #78716c; --acc: #0f766e; --acc-hover: #115e59; --acc-soft: #f0fdfa;
    --font: "Instrument Sans", ui-sans-serif, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font); color: var(--ink); background: var(--bg); display: flex;
         flex-direction: column; font-size: 15px; -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--surface);
           border-bottom: 1px solid var(--border); }
  .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--acc-soft);
         display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .dot svg { width: 17px; height: 17px; stroke: var(--acc); fill: none; stroke-width: 1.75;
             stroke-linecap: round; stroke-linejoin: round; }
  .biz { font-weight: 600; line-height: 1.25; }
  .sub { font-size: .8rem; color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; line-height: 1.5;
         white-space: pre-wrap; word-wrap: break-word; }
  .me { align-self: flex-end; background: var(--acc); color: #fff; border-bottom-right-radius: 4px; }
  .them { align-self: flex-start; background: var(--surface); border: 1px solid var(--border);
          border-bottom-left-radius: 4px; }
  .note { align-self: center; color: var(--muted); font-size: .82rem; text-align: center; }
  .typing i { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%;
              background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }
  form { display: flex; gap: 8px; padding: 12px; background: var(--surface); border-top: 1px solid var(--border); }
  input { flex: 1; font: inherit; font-size: .95rem; padding: 10px 12px; border: 1px solid var(--border-strong);
          border-radius: 8px; outline: none; color: var(--ink); }
  input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(15,118,110,.14); }
  button { font: inherit; font-weight: 600; border: none; border-radius: 8px; padding: 0 14px;
           background: var(--acc); color: #fff; cursor: pointer; display: flex; align-items: center; }
  button:hover { background: var(--acc-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 1.75;
               stroke-linecap: round; stroke-linejoin: round; }
  footer { text-align: center; font-size: .72rem; color: var(--muted); padding: 0 0 8px; background: var(--surface); }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="dot"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
  <div><div class="biz" id="biz">Chat with us</div><div class="sub">Ask about services, prices and bookings</div></div>
</header>
<div id="log" aria-live="polite"></div>
<form id="form">
  <input id="msg" autocomplete="off" maxlength="500" placeholder="Type your message…" aria-label="Your message">
  <button id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
</form>
<footer>Powered by Atithi</footer>
<script>
"use strict";
// Every reply is inserted as TEXT (textContent), never as HTML.
const key = new URLSearchParams(location.search).get("k") || "";
const log = document.getElementById("log");
let SID = null, busy = false;

function add(cls, text) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                  body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || "Something went wrong. Please try again.");
  return data;
}
async function start() {
  try {
    const s = await post("/api/public/session", { key });
    SID = s.session_id;
    if (s.business_name) document.getElementById("biz").textContent = s.business_name;
    add("them", "Hello! How can I help you today?");
  } catch (e) {
    add("note", e.message);
    document.getElementById("send").disabled = true;
  }
}
document.getElementById("form").onsubmit = async (ev) => {
  ev.preventDefault();
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text || busy || !SID) return;
  input.value = ""; busy = true; document.getElementById("send").disabled = true;
  add("me", text);
  const typing = add("them typing", ""); typing.innerHTML = "<i></i><i></i><i></i>";
  try {
    const r = await post("/api/public/chat", { session_id: SID, message: text });
    typing.remove();
    add("them", r.reply);
    if (r.ended) { input.disabled = true; input.placeholder = "Chat ended"; }
  } catch (e) {
    typing.remove(); add("note", e.message);
  } finally {
    busy = false; document.getElementById("send").disabled = !SID; input.focus();
  }
};
start();
</script>
</body>
</html>
